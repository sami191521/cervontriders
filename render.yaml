# Render Blueprint — deploys the Tour of Belize backend (FastAPI + Supabase).
# Render → New → Blueprint → pick this repo. Fill the sync:false vars (Supabase
# URL/key + admin creds) when prompted; TOB_SECRET is generated automatically.
services:
  - type: web
    name: tour-of-belize
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: TOB_SECRET            # token-signing key — Render generates a strong, stable value
        generateValue: true
      - key: TOB_ADMIN_USER        # bootstrap admin username
        sync: false
      - key: TOB_ADMIN_PASS        # bootstrap admin password — make it strong
        sync: false
      - key: SUPABASE_URL          # https://<ref>.supabase.co
        sync: false
      - key: SUPABASE_KEY          # Supabase SECRET key
        sync: false
